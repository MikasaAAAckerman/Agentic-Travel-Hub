name: CI

on:
  push:
    branches: [ master, main, 'v*-dev' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'notes/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'notes/**'

# 同一分支有新提交时，取消上一次还在跑的构建
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile (fail fast)
        run: mvn -B -DskipTests compile

      # 排除需要外部依赖的集成测试（@SpringBootTest 会连 PG / ES / MCP，CI 里没有）
      - name: Unit + smoke tests
        run: >
          mvn -B test
          -Dtest='!LlmCallLogTest'
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*'
          retention-days: 7
