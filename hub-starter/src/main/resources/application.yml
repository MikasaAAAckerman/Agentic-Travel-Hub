# 当前服务配置
server:
  port: 8080

spring:
  profiles:
    active: dev
  application:
    name: agentic-travel-hub

  # 文件上传（PDF 入库）：Spring Boot 默认仅 1MB，PDF 必须调大
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # PostgreSQL 数据源（PGVector 向量数据库）
  datasource:
    url: jdbc:postgresql://localhost:5432/travel_hub
    username: travel
    password: travel123

  ai:
    # 指定 Embedding 模型使用 DashScope
    model:
      embedding: dashscope

    # ── DashScope（通义千问 + Embedding）──
    dashscope:
      api-key: xxxxx
      chat:
        options:
          model: qwen-plus
      embedding:
        options:
          model: text-embedding-v3

    # ── DeepSeek（通过 OpenAI 兼容接口）──
    openai:
      api-key: xxxxx
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-pro
      embedding:
        enabled: false

    # ── PGVector 向量存储 ──
    vectorstore:
      pgvector:
        table-name: travel_hub_vectors
        dimensions: 1536
        distance-type: COSINE_DISTANCE

    # ── MCP 工具服务 ──
    mcp:
      client:
        enabled: true
        stdio:
          connections:
            amap-maps-server:
              command: npx.cmd
              args:
                - "-y"
                - "@amap/amap-maps-mcp-server"
              env:
                AMAP_MAPS_API_KEY: "your-amap-api-key"

# ==================== 日志配置 ====================
logging:
  level:
    org.springframework.ai: DEBUG
    com.travel.aiagent: DEBUG
  file:
    name: ${user.dir}/logs/travel-hub.log

# ==================== Actuator + Prometheus 指标 ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:14318/v1/traces

# ==================== 自定义配置 ====================

# Tool RAG 召回通道配置
# channel: bailian - 使用阿里云百炼云端检索（默认，包含 Dense + Sparse + Rerank）
# channel: local   - 使用本地 PGVector + BM25 多路召回
tool-rag:
  channel: local

# Tool 工具召回重排配置（可选）：配置了 tool-rerank.model 才会启用重排
# model 引用模型池路径 {provider}.models.{modelKey}，例：qwen.models.qwen3.7-text-rerank
# 模型池（qwen/deepseek/openrouter 的 api-key/endpoint/models）在 application-dev.yml 里维护
# 想关闭重排：注释掉 model 这一行即可
tool-rerank:
  model: qwen.models.qwen3.7-text-rerank

# ==================== PDF 多模态 RAG ====================
# 上传 PDF → 解析分块（带页码/bbox）→ 文本向量 + BM25 → 页面图片（多模态向量）
pdf-rag:
  store-dir: pdf-store      # 原件 + 页面图存储目录（相对 user.dir；未来可换 OSS）
  chunk-size: 800           # 分块目标长度（字符）
  chunk-overlap: 150        # 相邻块重叠（字符），避免跨块信息断裂
  page-dpi: 150             # 页面渲染 DPI（多模态 embedding 的图片输入）

# 旅行资料库名称（DashScope 知识库）
travel-document-retriever-name: "旅行衣食住行资料库"

# SubAgent 循环次数限制
max-loop-times:
  orchestrator-to-subagent: 16
  planner-to-worker: 7

# Tavily 搜索 API Key
tavily-api-secret: your-tavily-api-key
